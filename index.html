<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malmö Events</title>
  <meta name="description" content="Christmas markets, food and drink, art, design, concerts and more happening in Malmö.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%23b33a2b'/><text x='16' y='22.5' font-size='17' text-anchor='middle' fill='%23f4f1ea' font-family='serif'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="brand">
        <span class="hanko" aria-hidden="true">M</span>
        <div>
          <h1>Malmö Events</h1>
          <p class="lede">Markets, food, art, design and music in the city.</p>
        </div>
      </div>
      <p class="vertical" aria-hidden="true">マルメの催し</p>
    </div>
  </header>

  <div class="wrap layout">
    <aside class="side" aria-label="Filter events">
      <div class="block">
        <label class="label" for="q">Search</label>
        <input id="q" type="search" placeholder="Event, artist or venue" autocomplete="off">
      </div>

      <button type="button" class="toggle" id="toggle" aria-expanded="false" aria-controls="more">
        <span>Calendar &amp; filters</span><span class="toggle-sum" id="toggle-sum"></span><span class="toggle-mark" aria-hidden="true">＋</span>
      </button>

      <div class="more" id="more">
      <div class="block">
        <span class="label" id="cal-label">Calendar</span>
        <div class="cal" id="cal" role="group" aria-labelledby="cal-label"></div>
        <p class="cal-hint" id="cal-hint">Pick a day. Pick a later day to make a range.</p>
      </div>

      <div class="block">
        <span class="label" id="when-label">When</span>
        <div class="options" id="when" role="group" aria-labelledby="when-label"></div>
      </div>

      <div class="block">
        <span class="label" id="cat-label">Type</span>
        <div class="options" id="cats" role="group" aria-labelledby="cat-label"></div>
      </div>

      <div class="block">
        <label class="label" for="venue">Venue</label>
        <select id="venue"><option value="">All venues</option></select>
      </div>
      </div>
    </aside>

    <main class="main">
      <p class="count" id="count" aria-live="polite"></p>
      <div id="list"></div>
    </main>
  </div>

  <footer class="wrap footer">
    <p>Listings are gathered from organisers, ticket sites, event guides and Instagram. Dates and prices can change, so check the linked source before you go.</p>
    <p id="updated"></p>
  </footer>

  <script src="events.js"></script>
  <script src="app.js"></script>
</body>
</html>
